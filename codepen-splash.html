<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAXLO Splash Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font: 'Inter', sans-serif;
  --color-dark: #24272E;
  --color-accent: #FF8270;
}

body { background: white; overflow: hidden; }

.splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.bg-rect {
  position: absolute;
  inset: 0;
  background: #24272E;
  will-change: clip-path;
  z-index: 0;
}

.logo-group {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  will-change: transform;
}

.logo-svg {
  width: clamp(320px, 55vw, 880px);
  height: auto;
}

.sp-overlay {
  position: absolute;
  font-family: var(--font);
  color: #24272E;
  white-space: nowrap;
  will-change: transform, opacity;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.sp-multi { font-weight: 300; }

.sp-local-ops {
  font-weight: 400;
  letter-spacing: 0.08em;
  transform: translate(0, -50%);
}

.cutout-stripe { transform-origin: center 0; }

/* Replay button */
.replay-btn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 10000;
  font-family: var(--font);
  font-size: 14px;
  padding: 10px 20px;
  background: #24272E;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s;
}
.replay-btn.visible { opacity: 1; }
.replay-btn:hover { background: #3a3e47; }
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="bg-rect" id="bgRect"></div>
  <div class="logo-group" id="logoGroup">
    <svg id="logoSvg" class="logo-svg" viewBox="0 0 177 37" fill="none" overflow="visible" xmlns="http://www.w3.org/2000/svg">
      <!-- morphRect -->
      <path id="morphRect" d="M22.749,0 L50.949,0 Q54.949,0 54.949,4 L54.949,33 Q54.949,37 50.949,37 L22.749,37 Q18.749,37 18.749,33 L18.749,4 Q18.749,0 22.749,0 Z" fill="#24272E" opacity="0"/>
      <!-- A1 -->
      <g id="a1" opacity="0">
        <path d="M25.735 29.2004H10.089L7.28289 36.807H0L13.811 0.119141H22.3888L36.1997 36.807H28.5395L25.7333 29.2004H25.735ZM12.1924 23.5881H23.63L18.9905 11.0166L17.912 7.23933L16.8335 11.0166L12.1941 23.5881H12.1924Z" fill="#24272E"/>
      </g>
      <!-- A2 -->
      <g id="a2" opacity="0">
        <path d="M63.2313 29.2004H47.5854L44.7792 36.807H37.4963L51.309 0.119141H59.8868L73.6978 36.807H66.0358L63.2297 29.2004H63.2313ZM49.6904 23.5881H61.128L56.4885 11.0166L55.41 7.23933L54.3315 11.0166L49.6921 23.5881H49.6904Z" fill="#24272E"/>
      </g>
      <!-- X -->
      <g id="xLetter" opacity="0">
        <path d="M93.4447 26.1242L91.9335 23.5344L90.3685 26.1242L82.9229 36.807H75.261L88.1562 17.8701L76.1801 0.119141H84.5969L91.0713 9.23701L92.7436 12.0968L94.4159 9.23701L100.781 0.119141H108.388L96.4656 17.7611L109.305 36.8053H100.889L93.443 26.1225L93.4447 26.1242Z" fill="#24272E"/>
      </g>
      <!-- L -->
      <g id="lLetter" opacity="0">
        <path d="M113.891 0.119141H121.174V30.9263H138.168V36.807H113.889V0.119141H113.891Z" fill="#24272E"/>
      </g>
      <!-- O -->
      <g id="oLetter" opacity="0">
        <path class="o-outer" d="M141 18.553C141 7.1401 147.664 0 158.473 0C169.283 0 176 7.1401 176 18.553C176 29.9659 169.283 37.002 158.473 37.002C147.664 37.002 141 29.9659 141 18.553Z" fill="#24272E"/>
        <path class="o-inner" d="M148.241 18.553C148.241 26.474 152.02 31.164 158.473 31.164C164.927 31.164 168.759 26.422 168.759 18.553C168.759 10.684 164.929 5.837 158.473 5.837C152.018 5.837 148.241 10.632 148.241 18.553Z" fill="white"/>
      </g>
      <!-- Morph group -->
      <defs>
        <clipPath id="glyph-clip">
          <circle cx="158.5" cy="18.5" r="18.5"/>
        </clipPath>
      </defs>
      <g id="morphGroup" opacity="0">
        <g clip-path="url(#glyph-clip)">
          <circle id="solidDisk" cx="158.5" cy="18.5" r="18.5" fill="#24272E" opacity="0"/>
          <rect class="cutout-stripe" x="141.762" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="145.286" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="148.810" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="152.333" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="155.857" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="159.381" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="162.905" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="166.429" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="169.952" y="0" width="1.762" height="37" fill="white"/>
          <rect class="cutout-stripe" x="173.476" y="0" width="1.762" height="37" fill="white"/>
        </g>
      </g>
      <!-- Glyph -->
      <g id="glyphGroup" opacity="0">
        <path d="M141.179 24.7734C142.073 27.2357 143.506 29.5471 145.48 31.5229C147.454 33.4971 149.765 34.9312 152.229 35.8236L141.179 24.7734Z" fill="#FF8270"/>
        <path d="M140.074 18.6797C140.084 19.6106 140.165 20.5398 140.316 21.4607L155.54 36.6856C156.461 36.8366 157.391 36.9171 158.321 36.9272L140.074 18.6797Z" fill="#FF8270"/>
        <path d="M140.572 14.1895C140.403 14.9023 140.277 15.6236 140.193 16.3498L160.651 36.808C161.378 36.7241 162.099 36.5983 162.812 36.4289L140.572 14.1895Z" fill="#FF8270"/>
        <path d="M141.87 10.502C141.59 11.089 141.342 11.6895 141.127 12.2967L164.703 35.873C165.312 35.6583 165.911 35.41 166.498 35.1299L141.87 10.502Z" fill="#FF8270"/>
        <path d="M143.752 7.39648C143.383 7.88794 143.041 8.39448 142.729 8.9111L168.09 34.2721C168.608 33.9584 169.113 33.6162 169.605 33.2489L143.752 7.39648Z" fill="#FF8270"/>
        <path d="M146.131 4.78516C145.911 4.98476 145.693 5.19107 145.48 5.40408C145.267 5.6171 145.061 5.83348 144.861 6.05488L170.945 32.1388C171.165 31.9392 171.383 31.7328 171.596 31.5198C171.809 31.3068 172.015 31.0904 172.215 30.869L146.131 4.78516Z" fill="#FF8270"/>
        <path d="M148.987 2.65625C148.469 2.96991 147.962 3.3104 147.471 3.67941L173.322 29.5301C173.691 29.0387 174.031 28.5321 174.345 28.0138L148.987 2.65625Z" fill="#FF8270"/>
        <path d="M152.374 1.05469C151.765 1.26938 151.166 1.51763 150.577 1.79774L175.204 26.424C175.484 25.837 175.732 25.2365 175.947 24.6276L152.374 1.05469Z" fill="#FF8270"/>
        <path d="M156.426 0.119141C155.7 0.203006 154.978 0.327127 154.266 0.496536L176.503 22.7343C176.673 22.0215 176.799 21.2986 176.881 20.574L156.426 0.119141Z" fill="#FF8270"/>
        <path d="M175.896 12.1536C175.004 9.69135 173.572 7.38002 171.596 5.40414C169.621 3.42995 167.31 1.99585 164.846 1.10352L175.895 12.152L175.896 12.1536Z" fill="#FF8270"/>
        <path d="M161.537 0.24321C160.616 0.0922522 159.685 0.0100639 158.754 0L177 18.2458C176.99 17.3149 176.908 16.384 176.757 15.4631L161.537 0.24321Z" fill="#FF8270"/>
      </g>
    </svg>
    <span id="multiEl" class="sp-overlay sp-multi" style="opacity:0">&times;</span>
    <span id="localOpsEl" class="sp-overlay sp-local-ops" style="opacity:0">&nbsp;</span>
  </div>
</div>

<button class="replay-btn" id="replayBtn" onclick="location.reload()">Replay</button>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/MorphSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrambleTextPlugin.min.js"></script>
<script>
gsap.registerPlugin(MorphSVGPlugin, ScrambleTextPlugin);

const $ = id => document.getElementById(id);

const splash     = $('splash');
const bgRect     = $('bgRect');
const logoGroup  = $('logoGroup');
const logoSvg    = $('logoSvg');
const morphRect  = $('morphRect');
const a1         = $('a1');
const a2         = $('a2');
const xLetter    = $('xLetter');
const lLetter    = $('lLetter');
const oLetter    = $('oLetter');
const morphGroup = $('morphGroup');
const solidDisk  = $('solidDisk');
const glyphGroup = $('glyphGroup');
const multiEl    = $('multiEl');
const localOpsEl = $('localOpsEl');
const replayBtn  = $('replayBtn');

const vw = window.innerWidth;
const vh = window.innerHeight;

const svgRect    = logoSvg.getBoundingClientRect();
const pxPerUnit  = svgRect.width / 177;
const groupRect  = logoGroup.getBoundingClientRect();

// Position HTML overlays
const multiLeftPx  = svgRect.left + 92 * pxPerUnit - groupRect.left;
const multiTopPx   = svgRect.top + 18.5 * pxPerUnit - groupRect.top;
const multiFontSize = 37 * pxPerUnit * 1.1;
const labLeftPx    = svgRect.left + 115 * pxPerUnit - groupRect.left;
const labTopPx     = svgRect.top + 18.5 * pxPerUnit - groupRect.top;
const labFontSize  = Math.max(10, 8 * pxPerUnit);

gsap.set(multiEl, { left: multiLeftPx, top: multiTopPx, fontSize: multiFontSize, opacity: 0, scale: 0, rotation: -720 });
gsap.set(localOpsEl, { left: labLeftPx, top: labTopPx, fontSize: labFontSize, opacity: 0 });

// Initial state
gsap.set([a1, a2, xLetter, lLetter, oLetter], { opacity: 0 });
gsap.set(morphGroup, { opacity: 0 });
gsap.set(solidDisk, { opacity: 0 });
gsap.set(glyphGroup, { opacity: 0 });
gsap.set(morphRect, { opacity: 0 });

// Background rect inset target
const singleAWidth  = 36.2 * pxPerUnit;
const singleAHeight = 37 * pxPerUnit;
const aCenterXpx    = svgRect.left + 36.849 * pxPerUnit;
const aCenterYpx    = svgRect.top + 18.5 * pxPerUnit;
const insetTop    = aCenterYpx - singleAHeight / 2;
const insetRight  = vw - (aCenterXpx + singleAWidth / 2);
const insetBottom = vh - (aCenterYpx + singleAHeight / 2);
const insetLeft   = aCenterXpx - singleAWidth / 2;

gsap.set(bgRect, { clipPath: 'inset(0px 0px 0px 0px)', opacity: 1 });

// ═══ TIMELINE ═══
const tl = gsap.timeline({
  onComplete: () => replayBtn.classList.add('visible')
});

// PHASE 1: Full screen → shrinks to A-sized rectangle
tl.to(bgRect, {
  clipPath: `inset(${insetTop}px ${insetRight}px ${insetBottom}px ${insetLeft}px)`,
  duration: 0.9, ease: 'power2.inOut',
})
.to(bgRect, { borderRadius: '6px', duration: 0.3, ease: 'power2.inOut' }, '-=0.3')

// PHASE 1b: Rectangle → rounded rect → morphs into A
.call(() => gsap.set(morphRect, { opacity: 1 }))
.to(bgRect, { opacity: 0, duration: 0.15, ease: 'power2.in' })
.to(morphRect, {
  morphSVG: { shape: a1.querySelector('path'), shapeIndex: 'auto' },
  x: 18.749, duration: 0.7, ease: 'power2.inOut',
}, '-=0.05')

// PHASE 2: Cell division
.call(() => {
  gsap.set(a1, { opacity: 1, x: 18.749 });
  gsap.set(a2, { opacity: 1, x: -18.749 });
  gsap.set(morphRect, { opacity: 0 });
})
.to(a1, { scaleX: 1.15, scaleY: 0.92, duration: 0.15, ease: 'power2.in' })
.to(a2, { scaleX: 1.15, scaleY: 0.92, duration: 0.15, ease: 'power2.in' }, '<')
.to(a1, { x: 0, scaleX: 1, scaleY: 1, duration: 0.65, ease: 'elastic.out(1, 0.55)' })
.to(a2, { x: 0, scaleX: 1, scaleY: 1, duration: 0.65, ease: 'elastic.out(1, 0.55)' }, '<')
.call(() => {
  a1.removeAttribute('transform');
  a2.removeAttribute('transform');
  gsap.set(a1, { opacity: 1 });
  gsap.set(a2, { opacity: 1 });
})

// PHASE 3: x rotates in
.to(multiEl, { opacity: 1, scale: 1, rotation: 0, duration: 0.25, ease: 'back.out(1.7)' }, '+=0.02')

// PHASE 4: "Local Operations" scramble
.to(localOpsEl, { opacity: 1, duration: 0.01 }, '+=0.04')
.to(localOpsEl, {
  scrambleText: {
    text: 'Local Operations',
    chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
    speed: 0.8, revealDelay: 0.15,
  },
  duration: 0.6, ease: 'none',
})

// PHASE 5: Collapse to LO
.call(() => {
  const local = 'Local', ops = 'Operations';
  localOpsEl.innerHTML =
    local.split('').map((c,i) => `<span class="char-el ${i===0?'keep-char':'fade-char'}" style="display:inline-block">${c}</span>`).join('') +
    '<span class="space-char" style="display:inline-block">&nbsp;</span>' +
    ops.split('').map((c,i) => `<span class="char-el ${i===0?'keep-char':'fade-char'}" style="display:inline-block">${c}</span>`).join('');
}, null, '+=0.15')
.call(() => {
  gsap.to(localOpsEl.querySelectorAll('.fade-char'), {
    opacity: 0, width: 0, marginRight: 0, paddingRight: 0,
    duration: 0.3, ease: 'power2.inOut', stagger: 0.015,
  });
  gsap.to(localOpsEl.querySelector('.space-char'), {
    width: 0, opacity: 0, duration: 0.2, delay: 0.1, ease: 'power2.inOut',
  });
})
.to({}, { duration: 0.35 })

// PHASE 5b: LO scales up via SVG letters
.call(() => {
  const sr = logoSvg.getBoundingClientRect();
  const ppu = sr.width / 177;
  const th = 37 * ppu;
  const txt = parseFloat(getComputedStyle(localOpsEl).fontSize);
  const ss = txt / th;
  gsap.set(lLetter, { opacity: 0, scale: ss, svgOrigin: '126 18.5' });
  gsap.set(oLetter, { opacity: 0, scale: ss, svgOrigin: '158.5 18.5' });
})
.to(localOpsEl, { opacity: 0, duration: 0.15, ease: 'power2.in' })
.to(lLetter, { opacity: 1, duration: 0.15, ease: 'power2.out' }, '<')
.to(oLetter, { opacity: 1, duration: 0.15, ease: 'power2.out' }, '<+=0.02')
.to(lLetter, { scale: 1, svgOrigin: '126 18.5', duration: 0.5, ease: 'elastic.out(1, 0.6)' }, '-=0.12')
.to(oLetter, { scale: 1, svgOrigin: '158.5 18.5', duration: 0.5, ease: 'elastic.out(1, 0.6)' }, '<+=0.03')

// PHASE 6: x->X and O->circle SIMULTANEOUSLY
.addLabel('simultaneous', '+=0.05')
.to(multiEl, { rotation: 360*2+45, scale: 0.6, opacity: 0, duration: 0.35, ease: 'power2.inOut' }, 'simultaneous')
.to(xLetter, { opacity: 1, duration: 0.25, ease: 'power2.out' }, 'simultaneous+=0.15')
.call(() => {
  const outer = oLetter.querySelector('.o-outer');
  if (outer) gsap.to(outer, {
    morphSVG: { shape: 'M141,18.5 C141,7.14 147.664,0 158.5,0 C169.336,0 176,7.14 176,18.5 C176,29.86 169.336,37 158.5,37 C147.664,37 141,29.86 141,18.5 Z', shapeIndex: 0 },
    duration: 0.5, ease: 'power2.inOut',
  });
  const inner = oLetter.querySelector('.o-inner');
  if (inner) gsap.to(inner, { scale: 0, opacity: 0, svgOrigin: '158.5 18.5', duration: 0.4, ease: 'power2.in' });
}, 'simultaneous')
.to({}, { duration: 0.5 }, 'simultaneous')

// PHASE 6b: disk + stripes
.to(oLetter, { opacity: 0, duration: 0.15, ease: 'power2.in' })
.call(() => {
  gsap.set(morphGroup, { opacity: 1 });
  gsap.set(solidDisk, { opacity: 1 });
})
.call(() => {
  const stripes = morphGroup.querySelectorAll('.cutout-stripe');
  gsap.set(stripes, { scaleY: 0 });
  gsap.to(stripes, { scaleY: 1, duration: 0.06, stagger: 0.025, ease: 'back.out(3)' });
})
.to({}, { duration: 0.35 })

// PHASE 6c: Rotate -45
.to(morphGroup, { rotation: -45, svgOrigin: '158.5 18.5', duration: 0.5, ease: 'elastic.out(1, 0.7)' })

// PHASE 7: Glyph replaces disk
.to(morphGroup, { opacity: 0, duration: 0.2, ease: 'power2.inOut' }, '+=0.15')
.to(glyphGroup, { opacity: 1, duration: 0.25, ease: 'power2.out' }, '<+=0.05')

// Hold
.to({}, { duration: 2.0 });
</script>
</body>
</html>
